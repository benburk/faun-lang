[workspace]
members = [
  "crates/barb",
  "crates/cli",
  "crates/core",
  "crates/driver",
  "crates/frontend",
  "crates/targets/*",
]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "0BSD"

[workspace.dependencies]
faun-aarch64-macos = { path = "crates/targets/aarch64-macos", version = "0.1.0" }
faun-barb = { path = "crates/barb", version = "0.1.0" }
faun-core = { path = "crates/core", version = "0.1.0" }
faun-driver = { path = "crates/driver", version = "0.1.0" }
faun-frontend = { path = "crates/frontend", version = "0.1.0" }
faun-mos6502-sim65 = { path = "crates/targets/mos6502-sim65", version = "0.1.0" }
faun-wasm32-wasi = { path = "crates/targets/wasm32-wasi", version = "0.1.0" }
faun-x86-64-linux = { path = "crates/targets/x86-64-linux", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
as_conversions = "warn"
too_many_lines = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# What a crate's modules say to each other is `pub(crate)`, which is what it
# is. This asks for `pub` wherever the module is private, and `pub` there is
# what `unreachable_pub` refuses -- rightly, since nothing outside can reach
# it. Of the two, the one naming what a thing is visible to is the true one.
redundant_pub_crate = "allow"

# The tests run programs on the reference interpreter, which at opt-level 0
# is about ten times slower; dependencies such as num-bigint never change,
# so they build once at full speed.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The compiler is split into crates along its tiers, and a function one
# crate calls in another is inlined there only where it is small or marked:
# without this, the frontend and the machine tier calling into Barb ran the
# compiler 4% slower than when Barb was a module of the core. Thin LTO
# inlines across the crates as across a crate's codegen units, and so
# compiles the same programs in 5% fewer instructions than the single crate
# did, for 5 seconds more on a release rebuild that touches only a target.
[profile.release]
lto = "thin"
