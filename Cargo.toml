[workspace]
members = ["crates/*"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
faun = { path = "crates/faun", version = "0.1.0" }
faun-mos6502-sim65 = { path = "crates/mos6502-sim65", version = "0.1.0" }
faun-wasm32-wasi = { path = "crates/wasm32-wasi", version = "0.1.0" }
faun-x86-64-linux = { path = "crates/x86-64-linux", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

# The compiler is allocation-heavy while constructing its syntax trees. An
# unoptimized allocator makes debug `faun check` timings describe the allocator
# build rather than the frontend.
[profile.dev.package.libmimalloc-sys]
opt-level = 3

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
as_conversions = "warn"
too_many_lines = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# What a crate's modules say to each other is `pub(crate)`, which is what it
# is. This asks for `pub` wherever the module is private, and `pub` there is
# what `unreachable_pub` refuses -- rightly, since nothing outside can reach
# it. Of the two, the one naming what a thing is visible to is the true one.
redundant_pub_crate = "allow"
