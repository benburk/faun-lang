[package]
name = "faun-cli"
version.workspace = true
default-run = "faun"
edition.workspace = true
description = "The Faun compiler as commands"

[[bin]]
name = "faun"
path = "src/main.rs"
# The command and library share a name; only the library has an API to document.
doc = false

[dependencies]
bpaf = "0.9"
faun.workspace = true
faun-core.workspace = true
faun-mos6502-sim65.workspace = true
faun-wasm32-wasi.workspace = true
faun-x86-64-linux.workspace = true
faun-x86-lab.workspace = true

[dev-dependencies]
libtest-mimic = "0.8"
num-bigint = "0.4.8"

# Each refused program is its own test, which libtest cannot list.
[[test]]
name = "refused"
harness = false

[lints]
workspace = true
