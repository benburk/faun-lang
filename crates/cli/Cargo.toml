[package]
name = "faun"
version.workspace = true
default-run = "faun"
edition.workspace = true
license.workspace = true
description = "The Faun compiler as commands"

[[bin]]
name = "faun"
path = "src/main.rs"
# Only the libraries have an API to document.
doc = false

[dependencies]
blake3 = "1.8.7"
bpaf = "0.9"
faun-aarch64-macos.workspace = true
faun-core.workspace = true
faun-frontend.workspace = true
faun-mos6502-sim65.workspace = true
faun-wasm32-wasi.workspace = true
faun-x86-64-linux.workspace = true
faun-x86-lab.workspace = true
mimalloc = { version = "0.1.52", features = ["no_thp"] }
tar = { version = "0.4.46", default-features = false }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
zstd = "0.14.4"

[dev-dependencies]
libtest-mimic = "0.8"
num-bigint = "0.4.8"

# Each refused program is its own test, which libtest cannot list.
[[test]]
name = "refused"
harness = false

# Each documentation example is its own test, which libtest cannot list.
[[test]]
name = "docs"
harness = false

[lints]
workspace = true
