[package]
name = "faun-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The primary Faun source frontend"

[[bench]]
name = "frontend"
harness = false

[[bench]]
name = "check"
harness = false

[dependencies]
faun-core.workspace = true
num-bigint = { version = "0.4.8", features = ["serde"] }
num-traits = "0.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
faun-x86-64-linux.workspace = true

[lints]
workspace = true
